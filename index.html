<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин косметики</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Выбери свой продукт</h1>
  <button class="toggle-btn">Поменять цвет кнопки</button>

  <button class="btn-register" id="openModalBtn">Регистрация</button>

  <div class="products-container"></div>

  <template id="product-card-template">
    <article class="product-card" data-id="">
      <div class="product-card__image-wrapper">
        <img src="" alt="" class="product-card__image">
      </div>
      <div class="product-card__body">
        <span class="product-card__category"></span>
        <h2 class="product-card__title"></h2>
        <p class="product-card__description"></p>
        <div class="product-card__ingredients">
          <h4 class="product-card__ingredients-title">состав:</h4>
          <ul class="product-card__ingredients-list"></ul>
        </div>
        <div class="product-card__footer">
          <span class="product-card__price-label">Цена</span>
          <span class="product-card__price-value"></span>
        </div>
      </div>
    </article>
  </template>

  <footer>
    <div class="footer-container">
      <nav aria-label="Навигация по сайту">
        <h3>Навигация</h3>
        <ul>
          <li><a href="#">Главная</a></li>
          <li><a href="#">О нас</a></li>
          <li><a href="#">Услуги</a></li>
          <li><a href="#">Контакты</a></li>
        </ul>
      </nav>

      <section aria-label="Контактная информация">
        <h3>Контакты</h3>
        <address>
          г. Октябрьский, ул. Ленина, д. 1<br>
          Телефон: <a href="tel:+79991234567">+7 (999) 1234567</a><br>
          Email: <a href="mailto:www.dmr777@gmail.com">www.dmr777@gmail.com</a>
        </address>
      </section>
      <section aria-label="Подписка на новости">
        <h3>Подписка</h3>
        <form class="subscribe-form" id="subscribeForm" novalidate>
          <label for="subscriberEmail">Электронная почта</label>
          <input
            type="email"
            id="subscriberEmail"
            name="email"
            placeholder="you@example.com"
            required
          >
          <button type="submit">Подписаться</button>
        </form>
      </section>
    </div>

    <div class="footer-bottom">
      &copy; 2025 Example. Все права защищены.
    </div>
  </footer>

  <div class="modal" id="registerModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal__overlay" data-close-modal></div>

    <div class="modal__content">
      <button class="modal__close" type="button" aria-label="Закрыть" data-close-modal>&times;</button>

      <h2 id="modalTitle">Регистрация</h2>

      <form class="register-form" id="registerForm" novalidate>
        <div class="form-field">
          <label for="firstName">Имя</label>
          <input type="text" id="firstName" name="firstName" placeholder="Введите имя" required minlength="2">
        </div>

        <div class="form-field">
          <label for="lastName">Фамилия</label>
          <input type="text" id="lastName" name="lastName" placeholder="Введите фамилию" required minlength="2">
        </div>

        <div class="form-field">
          <label for="birthDate">Дата рождения</label>
          <input type="date" id="birthDate" name="birthDate" required>
        </div>

        <div class="form-field">
          <label for="login">Логин</label>
          <input type="text" id="login" name="login" placeholder="Придумайте логин" required minlength="4">
        </div>

        <div class="form-field">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" placeholder="Минимум 6 символов" required minlength="6">
        </div>

        <div class="form-field">
          <label for="passwordRepeat">Повторение пароля</label>
          <input type="password" id="passwordRepeat" name="passwordRepeat" placeholder="Повторите пароль" required minlength="6">
        </div>

        <p class="form-error" id="formError">Пароли не совпадают или форма заполнена неверно.</p>

        <button type="submit">Зарегистрироваться</button>
      </form>
    </div>
  </div>
  <script type="module" src="homework-10.js"></script>
  <script type="module" src="modal.js"></script>
</body>
